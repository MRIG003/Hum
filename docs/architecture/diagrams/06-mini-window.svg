<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img"><rect width="840" height="310" fill="#ffffff"/><rect x="20" y="30" width="300" height="130" rx="9" fill="#dde9fb" stroke="#2563c9" stroke-width="1.4"/><text x="32" y="50" font-size="12.5" font-weight="700" fill="#123e86">Engage tab (main window)</text><text x="32" y="68" font-size="10.5" fill="#55544e">Owns the WebSocket and the shared store</text><text x="32" y="82" font-size="10.5" fill="#55544e">Holds the presenting switch</text><text x="32" y="96" font-size="10.5" fill="#55544e">Keeps working if the floating window closes</text><rect x="400" y="30" width="300" height="130" rx="9" fill="#d8f0e1" stroke="#1a6f40" stroke-width="1.4"/><text x="412" y="50" font-size="12.5" font-weight="700" fill="#14532f">Floating window</text><text x="412" y="68" font-size="10.5" fill="#55544e">Document Picture-in-Picture (Chromium)</text><text x="412" y="82" font-size="10.5" fill="#55544e">Renders pill or card from the same store</text><text x="412" y="96" font-size="10.5" fill="#55544e">No second connection</text><text x="412" y="110" font-size="10.5" fill="#55544e">Opens only after a user click</text><rect x="400" y="200" width="300" height="86" rx="9" fill="#f2f2ee" stroke="#b9b8af" stroke-width="1.4"/><text x="412" y="220" font-size="12.5" font-weight="700" fill="#3e3d39">Fallback: Safari and Firefox</text><text x="412" y="238" font-size="10.5" fill="#55544e">Second browser window beside the meeting</text><text x="412" y="252" font-size="10.5" fill="#55544e">Dot in the tab title when something waits</text><path d="M320 90 L400 90" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M393.7 93.0 L400 90 L393.7 87.0" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M326.3 87.0 L320 90 L326.3 93.0" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="360" y="80" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">state and events</text><path d="M170 160 L400 230" fill="none" stroke="#55544e" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M393.1 231.1 L400 230 L394.9 225.3" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="240" y="206" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">if not supported</text><rect x="20" y="200" width="300" height="86" rx="9" fill="#fbecc8" stroke="#8a5a00" stroke-width="1.4"/><text x="32" y="220" font-size="12.5" font-weight="700" fill="#6b4500">Presenting on</text><text x="32" y="238" font-size="10.5" fill="#55544e">Floating window is closed</text><text x="32" y="252" font-size="10.5" fill="#55544e">Incoming prompts are counted, not queued</text><path d="M170 200 L170 160" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M173.0 166.3 L170 160 L167.0 166.3" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="205" y="185" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">switch</text><path d="M320 235 L400 150" fill="none" stroke="#55544e" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M397.9 156.7 L400 150 L393.5 152.5" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="345" y="185" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">close</text></svg>