<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img"><rect width="820" height="372" fill="#ffffff"/><rect x="20" y="44" width="160" height="74" rx="9" fill="#f2f2ee" stroke="#b9b8af" stroke-width="1.4"/><text x="32" y="64" font-size="12.5" font-weight="700" fill="#3e3d39">Host browser</text><text x="32" y="82" font-size="10.5" fill="#55544e">Console page</text><text x="32" y="96" font-size="10.5" fill="#55544e">Plain HTML, CSS, JS</text><rect x="20" y="150" width="160" height="74" rx="9" fill="#f2f2ee" stroke="#b9b8af" stroke-width="1.4"/><text x="32" y="170" font-size="12.5" font-weight="700" fill="#3e3d39">Attendee browsers</text><text x="32" y="188" font-size="10.5" fill="#55544e">Many, one per person</text><text x="32" y="202" font-size="10.5" fill="#55544e">Plain HTML, CSS, JS</text><rect x="236" y="18" width="566" height="336" rx="12" fill="none" stroke="#85847d" stroke-width="1.2" stroke-dasharray="3 5"/><text x="248" y="34" font-size="11" font-weight="700" fill="#66655f" letter-spacing=".04em">ONE NODE.JS PROCESS</text><rect x="256" y="52" width="190" height="66" rx="9" fill="#ffffff" stroke="#b9b8af" stroke-width="1.4"/><text x="268" y="72" font-size="12.5" font-weight="700" fill="#1c1c1a">HTTP server</text><text x="268" y="90" font-size="10.5" fill="#55544e">Static files, create and look up</text><text x="268" y="104" font-size="10.5" fill="#55544e">meetings, security headers</text><rect x="256" y="150" width="190" height="82" rx="9" fill="#ffffff" stroke="#b9b8af" stroke-width="1.4"/><text x="268" y="170" font-size="12.5" font-weight="700" fill="#1c1c1a">WebSocket gateway</text><text x="268" y="188" font-size="10.5" fill="#55544e">Join by token, 25 msg/s limit,</text><text x="268" y="202" font-size="10.5" fill="#55544e">8 KB cap, update batching</text><text x="268" y="216" font-size="10.5" fill="#55544e">every 150 ms</text><rect x="256" y="262" width="190" height="70" rx="9" fill="#ffffff" stroke="#b9b8af" stroke-width="1.4"/><text x="268" y="282" font-size="12.5" font-weight="700" fill="#1c1c1a">1 second ticker</text><text x="268" y="300" font-size="10.5" fill="#55544e">Closes prompts, opens game</text><text x="268" y="314" font-size="10.5" fill="#55544e">windows, samples engagement</text><rect x="490" y="92" width="290" height="104" rx="9" fill="#dde9fb" stroke="#2563c9" stroke-width="1.4"/><text x="502" y="112" font-size="12.5" font-weight="700" fill="#123e86">Meeting domain (pure logic)</text><text x="502" y="130" font-size="10.5" fill="#55544e">Moments, engagement, dips, suggestions,</text><text x="502" y="144" font-size="10.5" fill="#55544e">games, points, snapshots</text><text x="502" y="158" font-size="10.5" fill="#55544e">No I/O. 21 unit tests</text><rect x="490" y="232" width="290" height="76" rx="9" fill="#fbecc8" stroke="#8a5a00" stroke-width="1.4"/><text x="502" y="252" font-size="12.5" font-weight="700" fill="#6b4500">In-memory store</text><text x="502" y="270" font-size="10.5" fill="#55544e">Map of meetings by code</text><text x="502" y="284" font-size="10.5" fill="#55544e">Lost on restart. Dropped 24 h after a meeting ends</text><path d="M180 80 L256 84" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M249.5 86.7 L256 84 L249.9 80.6" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="218" y="68" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">HTTPS</text><path d="M180 186 L256 190" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M249.5 192.7 L256 190 L249.9 186.6" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M186.5 183.3 L180 186 L186.1 189.4" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="218" y="172" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">WebSocket</text><path d="M446 190 L490 160" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M486.5 166.1 L490 160 L483.1 161.0" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M446 296 L490 190" fill="none" stroke="#55544e" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M490.4 197.0 L490 190 L484.8 194.7" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M635 196 L635 232" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M632.0 225.7 L635 232 L638.0 225.7" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="24" y="366" font-size="10.5" font-weight="400" fill="#66655f" text-anchor="start">Single process, no persistence, JavaScript without types. Good for a prototype, not for pilots beyond a few meetings.</text></svg>