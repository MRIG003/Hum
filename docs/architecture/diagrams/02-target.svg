<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img"><rect width="900" height="556" fill="#ffffff"/><rect x="20" y="12" width="596" height="96" rx="12" fill="none" stroke="#85847d" stroke-width="1.2" stroke-dasharray="3 5"/><text x="32" y="28" font-size="11" font-weight="700" fill="#66655f" letter-spacing=".04em">CLIENTS</text><rect x="36" y="36" width="566" height="60" rx="9" fill="#dde9fb" stroke="#2563c9" stroke-width="1.4"/><text x="48" y="56" font-size="12.5" font-weight="700" fill="#123e86">Web app (React, TypeScript)</text><text x="48" y="74" font-size="10.5" fill="#55544e">Host console  |  Attendee app  |  Floating mini window (Document Picture-in-Picture)</text><rect x="636" y="24" width="244" height="80" rx="9" fill="#ffffff" stroke="#85847d" stroke-width="1.4" stroke-dasharray="6 4"/><text x="648" y="44" font-size="12.5" font-weight="700" fill="#55544e">In-meeting apps (Phase 2)</text><text x="648" y="62" font-size="10.5" fill="#55544e">Meet, Zoom, Teams embed the</text><text x="648" y="76" font-size="10.5" fill="#55544e">same web app and add speaker data</text><rect x="36" y="138" width="566" height="52" rx="9" fill="#f2f2ee" stroke="#b9b8af" stroke-width="1.4"/><text x="48" y="158" font-size="12.5" font-weight="700" fill="#3e3d39">Edge: CDN, TLS, load balancer</text><text x="48" y="176" font-size="10.5" fill="#55544e">Static assets cached. Realtime traffic routed by meeting code to one owner node</text><rect x="20" y="214" width="596" height="150" rx="12" fill="none" stroke="#85847d" stroke-width="1.2" stroke-dasharray="3 5"/><text x="32" y="230" font-size="11" font-weight="700" fill="#66655f" letter-spacing=".04em">APPLICATION TIER (2 OR MORE NODES)</text><rect x="36" y="238" width="176" height="108" rx="9" fill="#ffffff" stroke="#b9b8af" stroke-width="1.4"/><text x="48" y="258" font-size="12.5" font-weight="700" fill="#1c1c1a">HTTP API</text><text x="48" y="276" font-size="10.5" fill="#55544e">Fastify</text><text x="48" y="290" font-size="10.5" fill="#55544e">Meetings, accounts,</text><text x="48" y="304" font-size="10.5" fill="#55544e">summaries, exports</text><rect x="224" y="238" width="176" height="108" rx="9" fill="#ffffff" stroke="#b9b8af" stroke-width="1.4"/><text x="236" y="258" font-size="12.5" font-weight="700" fill="#1c1c1a">WebSocket gateway</text><text x="236" y="276" font-size="10.5" fill="#55544e">Auth, schema checks,</text><text x="236" y="290" font-size="10.5" fill="#55544e">rate limits, fan-out</text><text x="236" y="304" font-size="10.5" fill="#55544e">with batching</text><rect x="412" y="238" width="190" height="108" rx="9" fill="#dde9fb" stroke="#2563c9" stroke-width="1.4"/><text x="424" y="258" font-size="12.5" font-weight="700" fill="#123e86">Meeting actors</text><text x="424" y="276" font-size="10.5" fill="#55544e">One per live meeting</text><text x="424" y="290" font-size="10.5" fill="#55544e">Domain rules from today</text><text x="424" y="304" font-size="10.5" fill="#55544e">Single writer, snapshots</text><rect x="636" y="214" width="244" height="70" rx="9" fill="#ffffff" stroke="#85847d" stroke-width="1.4" stroke-dasharray="6 4"/><text x="648" y="234" font-size="12.5" font-weight="700" fill="#55544e">Platform adapters (Phase 2)</text><text x="648" y="252" font-size="10.5" fill="#55544e">Verify platform tokens, map</text><text x="648" y="266" font-size="10.5" fill="#55544e">speaker and presenter events</text><rect x="636" y="296" width="244" height="66" rx="9" fill="#ffffff" stroke="#85847d" stroke-width="1.4" stroke-dasharray="6 4"/><text x="648" y="316" font-size="12.5" font-weight="700" fill="#55544e">Calendar service (Phase 2)</text><text x="648" y="334" font-size="10.5" fill="#55544e">Google and Microsoft OAuth,</text><text x="648" y="348" font-size="10.5" fill="#55544e">create events with the link</text><rect x="36" y="392" width="176" height="80" rx="9" fill="#d8f0e1" stroke="#1a6f40" stroke-width="1.4"/><text x="48" y="412" font-size="12.5" font-weight="700" fill="#14532f">Postgres</text><text x="48" y="430" font-size="10.5" fill="#55544e">Accounts, meetings, events,</text><text x="48" y="444" font-size="10.5" fill="#55544e">summaries, deletion log</text><rect x="224" y="392" width="176" height="80" rx="9" fill="#d8f0e1" stroke="#1a6f40" stroke-width="1.4"/><text x="236" y="412" font-size="12.5" font-weight="700" fill="#14532f">Redis</text><text x="236" y="430" font-size="10.5" fill="#55544e">Meeting ownership leases,</text><text x="236" y="444" font-size="10.5" fill="#55544e">rate limits, short-lived state</text><rect x="412" y="392" width="190" height="80" rx="9" fill="#d8f0e1" stroke="#1a6f40" stroke-width="1.4"/><text x="424" y="412" font-size="12.5" font-weight="700" fill="#14532f">Worker</text><text x="424" y="430" font-size="10.5" fill="#55544e">Retention deletion, summaries,</text><text x="424" y="444" font-size="10.5" fill="#55544e">email, exports</text><rect x="636" y="392" width="244" height="80" rx="9" fill="#ece3f7" stroke="#6b3fa0" stroke-width="1.4"/><text x="648" y="412" font-size="12.5" font-weight="700" fill="#4a2b73">Auth provider</text><text x="648" y="430" font-size="10.5" fill="#55544e">OIDC sign-in and magic links</text><text x="648" y="444" font-size="10.5" fill="#55544e">for hosts. Attendees stay anonymous</text><rect x="36" y="490" width="844" height="50" rx="9" fill="#f2f2ee" stroke="#b9b8af" stroke-width="1.4"/><text x="48" y="510" font-size="12.5" font-weight="700" fill="#3e3d39">Observability</text><text x="48" y="528" font-size="10.5" fill="#55544e">OpenTelemetry traces and metrics, Sentry for the browser, structured logs with no meeting content</text><path d="M319 96 L319 138" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M316.0 131.7 L319 138 L322.0 131.7" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="372" y="122" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">HTTPS and WSS</text><path d="M319 190 L319 238" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M316.0 231.7 L319 238 L322.0 231.7" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M212 292 L224 292" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M217.7 295.0 L224 292 L217.7 289.0" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M400 292 L412 292" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M405.7 295.0 L412 292 L405.7 289.0" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M124 346 L124 392" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M121.0 385.7 L124 392 L127.0 385.7" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M507 346 L330 392" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M335.3 387.5 L330 392 L336.9 393.4" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="470" y="383" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">events, snapshots</text><path d="M312 346 L312 392" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M309.0 385.7 L312 392 L315.0 385.7" fill="none" stroke="#55544e" stroke-width="1.5"/><text x="330" y="372" font-size="10.5" fill="#3e3d39" text-anchor="middle" style="paint-order:stroke" stroke="#fff" stroke-width="3">leases</text><path d="M580 346 L540 392" fill="none" stroke="#55544e" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M541.8 385.2 L540 392 L546.4 389.2" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M758 104 L758 214" fill="none" stroke="#55544e" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M755.0 207.7 L758 214 L761.0 207.7" fill="none" stroke="#55544e" stroke-width="1.5"/><path d="M636 250 L602 290" fill="none" stroke="#55544e" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M603.8 283.2 L602 290 L608.4 287.2" fill="none" stroke="#55544e" stroke-width="1.5"/></svg>