<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engage · My meetings</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="row"><a href="/" class="brand"><span class="brand-mark" aria-hidden="true"></span>Engage</a><span class="title">My meetings</span></div>
    <div class="row"><span class="small muted" id="who"></span><a href="/"><button class="primary">New meeting</button></a><button id="signout" class="ghost">Sign out</button></div>
  </header>
  <main class="host-wrap">
    <section class="card">
      <div id="list" class="stack"><p class="muted">Loading…</p></div>
      <p class="small muted" style="margin-top: 12px">Ended meetings are kept for 30 days, then deleted. You can delete any meeting sooner.</p>
    </section>
  </main>
  <script type="module" src="/js/meetings.js"></script>
</body>
</html>
