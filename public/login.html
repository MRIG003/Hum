<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engage · Sign in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="center-card">
    <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"></span>Engage</a>
    <form id="auth" class="card stack" autocomplete="on">
      <h1 id="auth-title">Sign in</h1>
      <p class="muted small">Hosts only. Attendees never need an account. An account keeps your past meetings and results in one place.</p>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="200" required>
        <p id="pw-hint" class="small muted" hidden>At least 8 characters.</p>
      </div>
      <p id="auth-error" class="small" style="color: var(--bad)" role="alert" hidden></p>
      <button class="primary" type="submit" id="auth-submit">Sign in</button>
      <button class="ghost" type="button" id="auth-toggle">Create an account instead</button>
      <a class="small" id="forgot-link" href="/forgot">Forgot your password?</a>
    </form>
    <p class="small muted"><a href="/privacy.html">How Engage handles data</a></p>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
